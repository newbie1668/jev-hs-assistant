name: Import hs-assistant component
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-hs-assistant.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download hs-assistant.tsx
        run: |
          set -euo pipefail
          page="https://tmpfiles.org/wcwiNW8UrV33/hs-assistant.tsx"
          html=$(curl -sSL "$page")
          url=$(printf '%s' "$html" | grep -oE 'https://tmpfiles.org/dl/[0-9]+\.[a-f0-9]+/[^"<> ]+' | head -1)
          echo "Fetching from $url"
          mkdir -p src/components
          curl -sSL "$url" -o src/components/hs-assistant.tsx
          wc -c src/components/hs-assistant.tsx
          test $(wc -c < src/components/hs-assistant.tsx) -eq 30201
          head -1 src/components/hs-assistant.tsx | grep -q 'use client'
          sha256sum src/components/hs-assistant.tsx
          # remove probe junk if present
          rm -f .mcp-ping.txt _probe.txt _size_probe_20k.txt data/hs2022/_tmpl_test.txt src/lib/typesafe/_file_ref_test.txt src/lib/typesafe/_probe.txt
          rm -rf build-parts
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "Restore real hs-assistant.tsx; remove probe/build-parts junk" && git push; fi
